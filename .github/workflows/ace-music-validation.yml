name: Test the ACE Music catalog candidate
on:
  push:
    branches:
      - qa/ace-music-registration
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.10'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Validate, build and generate the entry
        run: |
          go run ./cmd/validate --name ace-music
          go run ./cmd/build --tools ace-music
          go run ./cmd/catalog ace-music
          grep -q 'acemusic_get_task' catalogs/ace-music/catalog.yaml
          grep -q 'acemusic_list_models' catalogs/ace-music/catalog.yaml
      - name: Check that the generated catalog contains the expected tools
        run: |
          grep -E '^ *- name: acemusic_' catalogs/ace-music/catalog.yaml
